[package]
name = "hugshire-vault"
version = "0.1.0"
edition = "2021"
publish = false
description = "Hugshire Vault: pooled USDC supplied to RHEA lending. Principal returns only to its owner; only yield can go to allowlisted causes."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
