[package]
name = "hugshire-vault"
version = "2.0.0"
edition = "2021"
publish = false
description = "Hugshire Vault v2: share-based charitable-yield vault on RHEA lending. Principal returns only to its owner; yield goes only where each supporter authorised."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
