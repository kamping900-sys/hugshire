<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Community Heart Pool split</title>
<style>
/* Community Heart Pool → equal shares → each supporter picks a cause. Transparent overlay, 4.6 s. */
@font-face { font-family: Manrope; font-weight: 200 800; src: url(../assets/fonts/manrope-latin.woff2) format("woff2"); }
:root { --cream: #FFF9F0; --brown: #8A6448; --ink: #3A2A22; --muted: #7B6A5C; --orange: #F58A3C; --gold: #F6C445; }
html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; font-family: Manrope, system-ui, sans-serif; color: var(--ink); }
.shade { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 70% at 50% 50%, rgba(40,26,18,0.35), rgba(40,26,18,0.6)); animation: fade 0.5s both; }
.card { position: absolute; left: 50%; top: 50%; width: 1500px; height: 760px; margin: -380px 0 0 -750px; background: var(--cream); border: 4px solid var(--brown); border-radius: 44px; box-shadow: 0 10px 0 rgba(138,100,72,0.5), 0 30px 80px rgba(0,0,0,0.35); animation: pop 0.6s cubic-bezier(.2,1.3,.4,1) both; }
.label { position: absolute; top: 34px; left: 0; right: 0; text-align: center; font-size: 24px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; color: #8A6A1E; }
.pool { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; animation: pop 0.6s cubic-bezier(.2,1.4,.4,1) both 0.2s; }
.basket { width: 150px; height: 150px; border-radius: 50%; background: #FFF1C9; border: 4px solid #E6B84A; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 rgba(230,184,74,0.6); }
.basket img { width: 96px; }
.pool .nm { margin-top: 12px; font-size: 34px; font-weight: 800; }
.pool .sb { font-size: 22px; font-weight: 700; color: var(--muted); }
.lines { position: absolute; left: 0; top: 0; width: 1500px; height: 760px; }
.lines path { stroke: #E6B84A; stroke-width: 5; fill: none; stroke-dasharray: 12 10; stroke-dashoffset: 400; animation: draw 0.9s ease-out forwards; }
.who { position: absolute; top: 430px; width: 260px; display: flex; flex-direction: column; align-items: center; animation: pop 0.5s cubic-bezier(.2,1.4,.4,1) both; }
.who .m { width: 120px; height: 120px; border-radius: 30px; background: #FDE6D4; border: 3px solid var(--brown); overflow: hidden; display: flex; align-items: flex-end; justify-content: center; position: relative; }
.who .m img { width: 118px; }
.who .m img.gold { position: absolute; right: -16px; top: -18px; width: 54px; animation: pop 0.45s cubic-bezier(.2,1.6,.4,1) both; }
.who .eq { margin-top: 12px; font-size: 22px; font-weight: 800; color: #8A6A1E; background: #FFF4D6; border-radius: 999px; padding: 4px 14px; }
.who .town { margin-top: 12px; font-size: 26px; font-weight: 800; background: var(--orange); color: #fff; border: 3px solid var(--brown); border-radius: 16px; padding: 6px 16px; box-shadow: 0 4px 0 rgba(138,100,72,0.6); animation: pop 0.45s cubic-bezier(.2,1.6,.4,1) both; white-space: nowrap; }
.foot { position: absolute; bottom: 30px; left: 0; right: 0; text-align: center; font-size: 22px; font-weight: 700; color: var(--muted); animation: fade 0.5s both 2.6s; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes pop { from { opacity: 0; transform: scale(0.6) } to { opacity: 1; transform: scale(1) } }
@keyframes draw { to { stroke-dashoffset: 0 } }
.pool { transform: translateX(-50%); }
@keyframes popc { from { opacity: 0; transform: translateX(-50%) scale(0.6) } to { opacity: 1; transform: translateX(-50%) scale(1) } }
.pool { animation-name: popc; }
.out { animation: fade 0.4s reverse both 4.2s; }
</style>
</head>
<body>
<div class="out">
  <div class="shade"></div>
  <div class="card">
    <div class="label">Community Heart Pool · demo with simulated ad revenue</div>
    <svg class="lines" viewBox="0 0 1500 760">
      <path d="M750 300 C 750 360 240 360 240 430" style="animation-delay:.6s"/>
      <path d="M750 300 C 750 360 580 360 580 430" style="animation-delay:.7s"/>
      <path d="M750 300 C 750 360 920 360 920 430" style="animation-delay:.8s"/>
      <path d="M750 300 C 750 360 1260 360 1260 430" style="animation-delay:.9s"/>
    </svg>
    <div class="pool"><div class="basket"><img src="../assets/fruit_gold_1.png"></div><div class="nm">Shared charity budget</div><div class="sb">split equally</div></div>
    <div class="who" style="left:110px;animation-delay:1.0s"><div class="m"><img src="../assets/cat.png"><img class="gold" src="../assets/fruit_gold_1.png" style="animation-delay:1.4s"></div><div class="eq">1 equal share</div><div class="town" style="animation-delay:2.0s">Fernhollow</div></div>
    <div class="who" style="left:450px;animation-delay:1.1s"><div class="m"><img src="../assets/dog.png"><img class="gold" src="../assets/fruit_gold_1.png" style="animation-delay:1.5s"></div><div class="eq">1 equal share</div><div class="town" style="animation-delay:2.15s">Pawsbury</div></div>
    <div class="who" style="left:790px;animation-delay:1.2s"><div class="m"><img src="../assets/rabbit.png"><img class="gold" src="../assets/fruit_gold_1.png" style="animation-delay:1.6s"></div><div class="eq">1 equal share</div><div class="town" style="animation-delay:2.3s">Inkwell Hollow</div></div>
    <div class="who" style="left:1130px;animation-delay:1.3s"><div class="m"><img src="../assets/panda.png"><img class="gold" src="../assets/fruit_gold_1.png" style="animation-delay:1.7s"></div><div class="eq">1 equal share</div><div class="town" style="animation-delay:2.45s">Ladle Lane</div></div>
    <div class="foot">Every eligible supporter gets the same share and picks an approved cause.</div>
  </div>
</div>
</body>
</html>
